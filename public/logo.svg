<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 96" width="116" height="96" fill="none" role="img" aria-label="mesteoz logo">
  <defs>
    <linearGradient id="mzFrame" x1="6" y1="28" x2="72" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33e7d2"/>
      <stop offset="0.5" stop-color="#4b9bff"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="mzInk" x1="20" y1="40" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#45e8d8"/>
      <stop offset="1" stop-color="#4a7dff"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 3.5)">
    <!-- rounded screen frame -->
    <rect x="8" y="30" width="62" height="48" rx="13" stroke="url(#mzFrame)" stroke-width="5"/>
    <!-- play marker -->
    <path d="M26 44 L42 54 L26 64 Z" fill="url(#mzInk)" stroke="url(#mzInk)" stroke-width="8" stroke-linejoin="round"/>
    <!-- editing pencil crossing the frame corner -->
    <g transform="translate(101.2 20.1) rotate(50)">
      <rect x="-10" y="-3" width="20" height="10" rx="4" fill="url(#mzInk)"/>
      <rect x="-9" y="8" width="18" height="36" fill="url(#mzInk)"/>
      <path d="M-9 44 L9 44 L0 59 Z" fill="url(#mzInk)" stroke="url(#mzInk)" stroke-width="3" stroke-linejoin="round"/>
      <rect x="1.5" y="10" width="4" height="32" rx="2" fill="#e8fbff" opacity="0.4"/>
      <rect x="-9" y="43" width="18" height="1.6" fill="#eaf7ff" opacity="0.55"/>
    </g>
  </g>
</svg>